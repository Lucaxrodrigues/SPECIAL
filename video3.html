  <script id="alfa-meta-script">
(()=>{'use strict';
const PIXEL='25604776625865776',API='https://alfa-max-stripe.lucaszrodx.workers.dev';
const KEY='alfa-marketing-v1',VISITOR='alfa-meta-visitor-v2',ATTR='alfa-meta-attribution-v2',QUEUE='alfa-meta-queue-v2';
const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const attrs=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign_id','adset_id','ad_id','placement','site_source_name'];
const entry=new URLSearchParams(location.search),pageId=crypto.randomUUID(),pageTime=Math.floor(Date.now()/1000);
let choice=null,automatic=false,visitor=null,visitToken=null,booting=null,auth=null,scriptReady=false,scriptStarted=false,checkoutId=null,contactWaiting=null,flushing=false,retryTimer=null,policyReady=false,pixelGraceUntil=0;
const pending=new Map(),receiptsSeen=new Map();let attribution={},realClick=null;
function read(k,session=false){try{return JSON.parse((session?sessionStorage:localStorage).getItem(k)||'null');}catch{return null;}}
function save(k,v,session=false){try{(session?sessionStorage:localStorage).setItem(k,JSON.stringify(v));}catch{}}
function cookie(k){try{return document.cookie.split('; ').find(x=>x.startsWith(k+'='))?.slice(k.length+1)||'';}catch{return '';}}
function allowed(){return choice!==false&&(choice===true||automatic);}
function cleanSource(){return location.origin+location.pathname;}
function rememberAttribution(){
 const old=read(ATTR);attribution=old&&Date.now()-old.at<90*86400000?old.data:{};realClick=old?.click&&Date.now()-old.click.createdAt<90*86400000?old.click:null;
 const fresh={};for(const k of attrs){const v=entry.get(k);if(v&&v.length<=200&&!/[\\u0000-\\u001f@]/.test(v))fresh[k]=v;}
 if(Object.keys(fresh).length)attribution=fresh;
 const click=entry.get('fbclid');
 if(click&&/^[A-Za-z0-9_.-]{1,450}$/.test(click)){
  const existing=cookie('_fbc');
  if(!existing.endsWith('.'+click)){
   const value=realClick?.fbclid===click?realClick.fbc:'fb.1.'+Date.now()+'.'+click;
   realClick={fbclid:click,fbc:value,createdAt:realClick?.fbclid===click?realClick.createdAt:Date.now()};
   try{document.cookie='_fbc='+value+'; Max-Age=7776000; Path=/; Secure; SameSite=Lax';}catch{}
  }
 }
 const native=cookie('_fbc');if(/^fb\\.\\d+\\.\\d{10,16}\\.[A-Za-z0-9_.-]+$/.test(native)){realClick={fbclid:native.split('.').slice(3).join('.'),fbc:native,createdAt:Number(native.split('.')[2])};}
 save(ATTR,{data:attribution,click:realClick,at:Date.now()});
}
function context(){const c={choice,automatic,consent:choice===true,gpc:false,source:cleanSource()};if(allowed()){c.visitorId=visitor?.id;c.fbp=cookie('_fbp');c.fbc=cookie('_fbc')||realClick?.fbc||'';c.tracking={...attribution};}return c;}
function persist(){save(QUEUE,[...pending.values()].slice(-100),true);}
function enqueue(item){
 if(!allowed())return;
 const k=item.eventId;
 if(pending.has(k))return;
 const pixelSent=!!read('alfa-meta-sent:'+k),capiSent=item.name==='Purchase'||!!read('alfa-meta-capi:'+k);
 if(pixelSent&&capiSent)return;
 const record={...item,pixelSent,capiSent};pending.set(k,record);if(item.name==='Purchase')pixel(record);persist();schedule();
}
function schedule(){if(!retryTimer)retryTimer=setTimeout(()=>{retryTimer=null;flush();},1200);}
async function post(path,body,token){const r=await fetch(API+'/v2/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body),credentials:'omit',keepalive:true,signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('tracking_http_'+r.status);return r.json();}
async function hash(v){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))).map(x=>x.toString(16).padStart(2,'0')).join('');}
function pixel(item){
 if(!allowed()||!scriptReady||item.pixelSent)return;
 const method=item.name==='CheckoutContactProvided'?'trackCustom':'track';
 window.fbq(method,item.name,item.custom,{eventID:item.eventId});item.pixelSent=true;save('alfa-meta-sent:'+item.eventId,Date.now());
}
async function flush(){
 if(flushing||!allowed())return;flushing=true;
 try{
  for(const item of pending.values())pixel(item);
  if(!visitToken)await boot();
  if(!scriptReady&&Date.now()<pixelGraceUntil){schedule();return;}
  for(const [id,item]of pending){
   if(!allowed())break;
   if(item.eventTime<Date.now()/1000-86400){pending.delete(id);continue;}
   pixel(item);
   if(!item.capiSent&&visitToken){
    const meta=item.frozenMeta||context();item.frozenMeta=meta;
    try{const result=await post('meta-events',{visitorId:visitor.id,eventName:item.name,eventTime:item.eventTime,pageId:item.pageId,checkoutId:item.checkoutId,sessionId:item.sessionId,sessionToken:item.sessionToken,contact:item.contact,meta},visitToken);if(result.recorded){item.capiSent=true;save('alfa-meta-capi:'+id,Date.now());}}
    catch{}
   }
   if(item.pixelSent&&item.capiSent)pending.delete(id);
  }
 }catch{}finally{flushing=false;persist();if(!retryTimer&&allowed()&&[...pending.values()].some(x=>!x.capiSent)){retryTimer=setTimeout(()=>{retryTimer=null;flush();},15000);}}
}
async function startPixel(){
 if(!allowed()||scriptStarted)return;scriptStarted=true;pixelGraceUntil=Date.now()+1200;
 if(!window.fbq){const f=window.fbq=function(){f.callMethod?f.callMethod.apply(f,arguments):f.queue.push(arguments);};if(!window._fbq)window._fbq=f;f.push=f;f.loaded=true;f.version='2.0';f.queue=[];}
 window.fbq('consent','grant');window.fbq('set','autoConfig',false,PIXEL);
 window.fbq('init',PIXEL,{external_id:visitor.id});
 const script=document.createElement('script');script.async=true;script.src='https://connect.facebook.net/en_US/fbevents.js';
 script.onload=()=>{scriptReady=true;sync();flush();};script.onerror=()=>{scriptStarted=false;flush();};document.head.append(script);
}
async function boot(){
 if(!allowed())return;if(visitToken)return;if(booting)return booting;
 booting=(async()=>{
  const previous=read(VISITOR);visitor=previous&&uuid.test(previous.id)&&previous.until>Date.now()?previous:{id:crypto.randomUUID(),until:Date.now()+180*86400000};save(VISITOR,visitor);
  rememberAttribution();
  startPixel().catch(()=>{});

  for(const item of read(QUEUE,true)||[])if(item.eventTime>Date.now()/1000-86400&&!pending.has(item.eventId))pending.set(item.eventId,item);
  enqueue({name:'PageView',eventId:'pv_'+pageId,eventTime:pageTime,pageId,custom:{integration_test:false,...attribution}});
  let r;try{r=await post('meta-init',{visitorId:visitor.id,meta:context()});}catch{console.warn('[AlfaMeta] meta-init indisponível; envio CAPI será tentado novamente.');}
  if(r?.visitToken)visitToken=r.visitToken;
  if(auth?.isCheckout)queueIC();for(const r of receiptsSeen.values())queueReceipt(r);if(contactWaiting)contact(contactWaiting);sync();
 })();try{await booting;}finally{booting=null;}
}
function sync(){
 if(auth){post('meta-context',{sessionId:auth.id,meta:context()},auth.token).catch(()=>{});}
 if(visitor&&visitToken){post('meta-choice',{visitorId:visitor.id,meta:context()},visitToken).catch(()=>{});}
}
function currentCheckout(){
 if(checkoutId)return checkoutId;
 const old=read('alfa-meta-checkout-v2',true);
 checkoutId=old&&old.until>Date.now()&&uuid.test(old.id)?old.id:crypto.randomUUID();
 save('alfa-meta-checkout-v2',{id:checkoutId,until:Date.now()+30*60000},true);return checkoutId;
}
function queueIC(){if(!allowed()||!auth?.isCheckout)return;const id=currentCheckout();enqueue({name:'InitiateCheckout',eventId:'checkout_'+id,eventTime:Math.floor(Date.now()/1000),checkoutId:id,sessionId:auth.id,sessionToken:auth.token,custom:{currency:'USD',value:27,value_basis:'offer_reference_usd',content_ids:['alfa_max'],content_type:'product',num_items:1,integration_test:false,...attribution}});}
function observe(data,path,request){
 if(data?.statusToken&&data.sessionId){auth={id:data.sessionId,token:data.statusToken,isCheckout:true};queueIC();sync();}
 else if(request?.token&&request?.id){auth={id:request.id,token:request.token,isCheckout:['session','status','consent'].includes(path)};}
 const receipts=[data?.metaPurchase,...(data?.metaPurchases||[])].filter(Boolean);
 for(const r of receipts){receiptsSeen.set(r.eventId,r);queueReceipt(r);}
 if(receipts.length)save('alfa-meta-checkout-v2',null,true);
 if(contactWaiting)contact(contactWaiting);sync();flush();
}
function queueReceipt(r){
 if(!r.eventId||typeof r.value!=='number')return;
 enqueue({name:'Purchase',eventId:r.eventId,eventTime:Math.floor(Date.now()/1000),custom:{currency:r.currency,value:r.value,value_basis:r.value_basis,charged_currency:r.charged_currency,charged_value:r.charged_value,content_ids:[r.offer],content_type:'product',num_items:1,order_id:r.sessionId,integration_test:false,...attribution}});
}
async function contact(buyer){
 contactWaiting={email:buyer?.email||'',phone:buyer?.phone||''};if(!allowed()||!auth?.isCheckout||!visitor)return;
 const email=contactWaiting.email.trim().toLowerCase(),phone=contactWaiting.phone.replace(/\\D/g,'');
 if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)||email.length>254)return;
 const id=currentCheckout();const c={em:await hash(email)};if(phone.length>=6&&phone.length<=15)c.ph=await hash(phone);
 enqueue({name:'CheckoutContactProvided',eventId:'contact_'+id,eventTime:Math.floor(Date.now()/1000),checkoutId:id,sessionId:auth.id,sessionToken:auth.token,contact:c,custom:{currency:'USD',value:27,value_basis:'offer_reference_usd',content_ids:['alfa_max'],content_type:'product',num_items:1,integration_test:false,...attribution}});
 contactWaiting=null;
}
function decide(value){
 choice=value;save(KEY,{allowed:value,at:Date.now()});
 if(!value){window.fbq?.('consent','revoke');pending.clear();persist();for(const k of ['_fbp','_fbc'])try{document.cookie=k+'=; Max-Age=0; Path=/; Secure; SameSite=Lax';document.cookie=k+'=; Max-Age=0; Path=/; Domain='+location.hostname+'; Secure; SameSite=Lax';}catch{}save(ATTR,null);realClick=null;attribution={};}
 else{window.fbq?.('consent','grant');boot().then(flush).catch(()=>{});}
 sync();updatePreference();
}
function updatePreference(){const el=document.getElementById('alfa-meta-state');if(el)el.textContent=allowed()?'Publicidad: activada.':'Publicidad: desactivada.';}
async function init(){
 choice=null;automatic=true;policyReady=true;
 updatePreference();if(allowed()){try{await boot();flush();}catch{setTimeout(()=>boot().then(flush).catch(()=>{}),5000);}}
}
window.AlfaMeta={context,observe,contact,tracking:()=>({...attribution})};
window.addEventListener?.('online',()=>{if(allowed()){startPixel().catch(()=>{});boot().then(flush).catch(()=>{});}});
window.addEventListener?.('pagehide',()=>{if(allowed()){for(const item of pending.values())pixel(item);persist();}});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>init().catch(()=>{}),{once:true});else init().catch(()=>{});
})();

  <script>
    function actualizarFecha() {
      const hoy = new Date();
      const dia = String(hoy.getDate()).padStart(2, '0');
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const ano = hoy.getFullYear();
      document.getElementById('data-limite').innerText = dia + '/' + mes + '/' + ano;
    }
    function randomizarPersonas() {
      const min = 727;
      const max = 1000;
      const numero = Math.floor(Math.random() * (max - min + 1)) + min;
      document.getElementById('contador-pessoas').innerText = numero;
    }
    window.addEventListener('load', function() {
      actualizarFecha();
      randomizarPersonas();
    });
  </script>

  <script id="alfa-video-navigation">
  (function(){
    'use strict';
    const button=document.getElementById('cta-button');
    if(!button)return;
    const configuredHref=button.getAttribute('href');
    const keys=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign_id','adset_id','ad_id','placement','site_source_name'];
    const entry=new URLSearchParams(location.search);
    function valid(value,max){return typeof value==='string'&&value.length>0&&value.length<=max&&!/[\\u0000-\\u001f\\u007f@]/.test(value)&&!/(?:https?:|sk_live|sk_test|secret_)/i.test(value);}
    function updateLink(){
      try{
        const target=new URL(configuredHref,location.href);
        if(target.origin!==location.origin)return;
        const fresh=keys.some(key=>valid(entry.get(key),200));
        const saved=fresh?{}:(window.AlfaMeta?.tracking?.()||{});
        for(const key of keys){const value=fresh?entry.get(key):saved[key];if(valid(value,200))target.searchParams.set(key,value);}
        const click=entry.get('fbclid');
        if(click&&/^[A-Za-z0-9_.-]{1,450}$/.test(click))target.searchParams.set('fbclid',click);
        button.href=target.href;
      }catch{}
    }
    updateLink();
    for(const event of ['click','auxclick','contextmenu','focus'])button.addEventListener(event,updateLink);
    window.addEventListener('pageshow',updateLink);
  })();
  </script>
