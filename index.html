<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244e43"><meta name="description" content="Alfa Max: tu semana, tu hogar y tus listas en un solo lugar."><title>Alfa Max · Mi hogar</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="app.js" defer></script></head><body>
<div id="app"><div class="loading">Preparando tu espacio…</div></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><div><span class="eyebrow">UN PEQUEÑO PASO</span><h2>Nueva tarea</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="Cerrar">×</button></div><label>¿Qué quieres hacer?<input name="title" required maxlength="160" placeholder="Ej.: ordenar el cajón de la cocina" autocomplete="off"></label><div class="form-row"><label>Ambiente<select name="room"><option>General</option><option>Cocina</option><option>Dormitorio</option><option>Baño</option><option>Sala</option><option>Lavandería</option></select></label><label>Día<input type="date" name="due_date" required></label></div><button class="primary" type="submit">Guardar tarea</button></form></dialog>
<noscript>Activa JavaScript para utilizar Alfa Max.</noscript></body></html>
